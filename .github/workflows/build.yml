name: Build APK

# Builds RustGet.apk in the cloud, so you don't need a computer with the Android SDK.
# Run it from the Actions tab (or push to main), then download "RustGet-apk" from the run page.
#
# Optional, so updates install over older builds: add repository secrets
#   KEYSTORE_B64  (base64 of your rustget.keystore)   and   KS_PASS (its password).
# Without them a fresh signing key is generated each run (uninstall the old build first).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Restore signing key (if provided)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > rustget.keystore; fi

      - name: Build
        env:
          KS_PASS: ${{ secrets.KS_PASS || 'android' }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RustGet-apk
          path: RustGet.apk
