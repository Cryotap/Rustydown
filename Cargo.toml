[package]
name = "rustget"
version = "0.1.0"
edition = "2021"
description = "Segmented, resumable, scriptless-setup download manager for Android, written in Rust"

[lib]
name = "rustget"
crate-type = ["cdylib", "rlib"]

# Desktop build of the same UI + engine, handy for testing on a computer.
[[bin]]
name = "rustget-desktop"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.10"
url = "2"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.13"
jni = "0.21"
ndk-context = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
